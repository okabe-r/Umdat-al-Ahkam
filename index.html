<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عُمْدَةُ الأَحْكَامِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F5ECD7;
    --parchment-dark: #EAD9BC;
    --parchment-deep: #D4B896;
    --ink: #2C1A0E;
    --ink-light: #5C3D1E;
    --emerald: #1B5E42;
    --emerald-light: #2E8B63;
    --emerald-pale: #E8F5EE;
    --gold: #B8860B;
    --gold-light: #DAA520;
    --gold-pale: #FFF8E1;
    --border: #C9A96E;
    --shadow: rgba(44, 26, 14, 0.15);

    /* ألوان التمييز والتلوين المعتمدة للنصوص */
    --book-red: #c00000;    /* الروايات الأخرى، الزيادات، التعليقات */
    --book-navy: #002060;   /* السند، الراوي، الآيات القرآنية */
    --book-blue: #0070c0;   /* الروايات الفرعية والألفاظ المخصوصة */

    /* ألوان شريط الحجب */
    --btn-mask-green: #175438;
    --btn-mask-gold: #b37d0c;
    --btn-mask-slate: #606b79;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
    background-color: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    direction: rtl;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(184,134,11,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(27,94,66,0.06) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A96E' fill-opacity='0.12'%3E%3Cpath d='M30 0l3.5 6.06L30 5.25l-3.5.81L30 0zm0 60l3.5-6.06L30 54.75l-3.5-.81L30 60zM0 30l6.06-3.5L5.25 30l.81 3.5L0 30zm60 0l-6.06 3.5L54.75 30l-.81-3.5L60 30zM15 15l2.47 4.28L15 18.5l-2.47.78L15 15zm30 0l2.47 4.28L45 18.5l-2.47.78L45 15zm-30 30l2.47-4.28L15 41.5l-2.47-.78L15 45zm30 0l2.47-4.28L45 41.5l-2.47-.78L45 45z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── الترويسة الرئيسية ── */
  .header {
    background: linear-gradient(135deg, var(--emerald) 0%, #0D3D28 100%);
    padding: 2.2rem 2rem 1.6rem;
    text-align: center;
    border-bottom: 3px solid var(--gold);
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23DAA520' fill-opacity='0.08'%3E%3Cpath d='M40 0 L46 14 L60 14 L49 22 L53 36 L40 28 L27 36 L31 22 L20 14 L34 14 Z'/%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
  }

  .header-ornament {
    color: var(--gold-light);
    font-size: 1.1rem;
    letter-spacing: 0.5rem;
    opacity: 0.85;
    margin-bottom: 0.4rem;
  }

  .header h1 {
    color: #FFF8E1;
    font-size: 2.3rem;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    position: relative;
  }

  .settings-dropdown {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 10;
  }

  .settings-dropdown select {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(218, 165, 32, 0.6);
    color: #FFF8E1;
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    backdrop-filter: blur(5px);
    transition: all 0.2s ease;
  }

  .settings-dropdown select:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: var(--gold-light);
  }

  .settings-dropdown select option {
    background: var(--emerald);
    color: #FFF8E1;
  }

  .main-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* ── إدارة الشاشات والتحويلات ── */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bismillah {
    text-align: center;
    color: var(--gold);
    font-size: 1.5rem;
    margin-bottom: 1.2rem;
    opacity: 0.9;
  }

  .section-label {
    text-align: center;
    color: var(--emerald);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }

  .grid-layout {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.3rem;
  }

  /* ── بطاقات الكتب والأبواب ── */
  .card-btn {
    background: linear-gradient(135deg, #ffffff 60%, var(--gold-pale));
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.6rem;
    cursor: pointer;
    text-align: right;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .card-btn::before {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 5px;
    background: linear-gradient(to bottom, var(--emerald-light), var(--emerald));
    border-radius: 0 12px 12px 0;
  }

  .card-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px var(--shadow);
    border-color: var(--gold-light);
    background: linear-gradient(135deg, #ffffff 30%, var(--gold-pale));
  }

  .card-btn-subtitle {
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  .card-btn-title {
    font-size: 1.22rem;
    color: var(--ink);
    line-height: 1.65;
    font-weight: 700;
  }

  .card-btn-desc {
    margin-top: 0.6rem;
    font-size: 0.88rem;
    color: var(--emerald);
    font-weight: 600;
  }

  /* ── أشرطة التنقل والعناوين ── */
  .nav-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--emerald);
    color: #FFF8E1;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.4rem;
    font-family: 'Amiri', serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .nav-btn.secondary {
    background: var(--ink-light);
  }

  .nav-btn.secondary:hover:not(:disabled) {
    background: var(--ink);
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--emerald-light);
    transform: translateY(-1px);
  }

  .nav-btn:disabled {
    background: #9ca3af;
    color: #f3f4f6;
    cursor: not-allowed;
    box-shadow: none;
  }

  .title-bar {
    background: linear-gradient(135deg, var(--emerald-pale), #ffffff);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    margin-bottom: 1.8rem;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .title-bar-label {
    font-size: 0.98rem;
    color: var(--gold);
    font-weight: 700;
  }

  .title-bar-name {
    font-size: 1.38rem;
    color: var(--emerald);
    font-weight: 700;
    line-height: 1.7;
    margin-top: 0.2rem;
  }

  /* ── شبكة بطاقات الأحاديث ── */
  .hadith-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 1.4rem;
  }

  .hadith-card {
    background: #FFFDF7;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.4rem 1.1rem;
    position: relative;
    box-shadow: 0 3px 12px var(--shadow);
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hadith-card::after {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid var(--parchment-deep);
    border-radius: 10px;
    pointer-events: none;
    opacity: 0.6;
  }

  .hadith-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px var(--shadow);
  }

  .hadith-id-badge {
    position: absolute;
    top: 0.8rem;
    left: 0.9rem;
    background: var(--emerald);
    color: #FFF8E1;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Amiri', serif;
    letter-spacing: 0.03em;
  }

  .hadith-card-sahabi {
    font-size: 1.22rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 0.6rem;
    padding-left: 3.5rem;
    line-height: 1.6;
    text-align: right;
  }

  .sahabi-prefix {
    color: var(--gold);
    font-size: 0.9rem;
    font-weight: 400;
    display: block;
    margin-bottom: 0.15rem;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to left, transparent, var(--border), transparent);
    margin: 0.8rem 0;
  }

  .hint-section {
    margin-top: 0.6rem;
    text-align: right;
  }

  .hint-btn {
    background: var(--gold-pale);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 0.35rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }

  .hint-btn:hover {
    background: var(--gold);
    color: #fff;
  }

  .test-inline-btn {
    background: var(--emerald-pale);
    border: 1px solid var(--emerald);
    color: var(--emerald);
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 0.35rem 1.1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-block;
    margin-right: 0.4rem;
  }

  .test-inline-btn:hover {
    background: var(--emerald);
    color: #fff;
  }

  .mask-inline-btn {
    background: #f0f4f8;
    border: 1px solid var(--btn-mask-slate);
    color: #3b4554;
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 0.35rem 1.1rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-block;
    margin-right: 0.4rem;
  }

  .mask-inline-btn:hover {
    background: var(--btn-mask-slate);
    color: #fff;
  }

  .hint-text-display {
    display: none;
    font-size: 0.95rem;
    color: var(--ink-light);
    line-height: 1.8;
    background: var(--gold-pale);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    margin-top: 0.7rem;
    text-align: justify;
  }

  .hint-text-display.shown { display: block; animation: fadeIn 0.25s ease; }

  .tap-hint {
    font-size: 0.78rem;
    color: var(--emerald);
    opacity: 0.75;
    margin-top: 0.9rem;
    text-align: center;
    font-style: italic;
  }

  /* عند تفعيل وضع إخفاء الراوي */
  body.hide-rawy .hadith-card-sahabi,
  body.hide-rawy .hadith-card .divider,
  body.hide-rawy .hint-btn {
    display: none !important;
  }

  body.hide-rawy .hint-text-display {
    display: block !important;
    margin-top: 0 !important;
    background: transparent !important;
    border: none !important;
    padding: 0.2rem 0 0.2rem 3.2rem !important;
    font-size: 1.1rem !important;
  }

  /* ── تنسيقات النصوص النبوية الملونة ── */
  .hadith-text-rendered {
    font-family: 'Amiri', 'Traditional Arabic', serif;
    font-size: 1.28rem;
    line-height: 2.25;
    color: #1a1a1a;
    text-align: justify;
    direction: rtl;
    word-spacing: 1px;
  }

  .hadith-text-rendered strong,
  .hadith-text-rendered b {
    font-weight: 700;
    color: #000000;
  }

  .hadith-text-rendered .text-red {
    color: var(--book-red) !important;
    font-weight: normal;
  }

  .hadith-text-rendered .text-navy {
    color: var(--book-navy) !important;
    font-weight: bold;
  }

  .hadith-text-rendered .text-blue {
    color: var(--book-blue) !important;
  }

  .quran-ayah {
    color: var(--book-navy);
    font-weight: bold;
    padding: 0 0.15rem;
  }

  .auto-sanad {
    color: var(--book-navy);
    font-weight: bold;
  }

  /* ── شريط وأدوات شاشة الحجب (Mask Screen) ── */
  #screen-mask {
    padding-bottom: 105px;
  }

  .mask-toolbar-container {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    padding: 0 1rem;
    pointer-events: none;
  }

  .mask-toolbar-pill {
    pointer-events: auto;
    background: rgba(247, 241, 227, 0.94);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 0.65rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    box-shadow: 0 10px 30px rgba(44, 26, 14, 0.22);
    flex-wrap: wrap;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    max-width: 95vw;
  }

  .mask-btn {
    font-family: 'Amiri', 'Traditional Arabic', serif;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 0.55rem 1.3rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
    white-space: nowrap;
    text-align: center;
  }

  .mask-btn:hover {
    filter: brightness(1.12);
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.22);
  }

  .mask-btn:active {
    transform: translateY(0);
  }

  .mask-btn-green { background-color: var(--btn-mask-green); }
  .mask-btn-gold { background-color: var(--btn-mask-gold); }
  .mask-btn-slate { background-color: var(--btn-mask-slate); }

  .masked-word {
    display: inline;
    border-radius: 4px;
    cursor: pointer;
    transition: filter 0.25s ease, background-color 0.25s ease, opacity 0.25s ease;
    padding: 0.05rem 0.15rem;
  }

  .masked-word.is-masked {
    filter: blur(6.5px);
    -webkit-filter: blur(6.5px);
    user-select: none;
    -webkit-user-select: none;
    opacity: 0.55;
    background-color: rgba(44, 26, 14, 0.08);
  }

  .masked-word.is-masked:hover {
    filter: blur(4.5px);
    -webkit-filter: blur(4.5px);
    opacity: 0.85;
    background-color: rgba(218, 165, 32, 0.25);
  }

  .masked-word:not(.is-masked) {
    filter: none;
    -webkit-filter: none;
    opacity: 1;
    background-color: transparent;
  }

  /* ── النافذة المنبثقة لعرض الحديث ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44, 26, 14, 0.65);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: #FFFDF7;
    border: 2px solid var(--border);
    border-radius: 16px;
    max-width: 760px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(44,26,14,0.4);
    animation: modalIn 0.28s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.93) translateY(18px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-header {
    background: linear-gradient(135deg, var(--emerald) 0%, #0D3D28 100%);
    padding: 1.2rem 1.6rem;
    border-radius: 14px 14px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
  }

  .modal-sahabi-info { flex: 1; }

  .modal-label {
    font-size: 0.8rem;
    color: rgba(255,248,225,0.7);
    margin-bottom: 0.2rem;
  }

  .modal-sahabi-name {
    font-size: 1.4rem;
    font-weight: 700;
    color: #FFF8E1;
  }

  .modal-close {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #FFF8E1;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    transition: background 0.2s;
  }

  .modal-close:hover { background: rgba(255,255,255,0.3); }

  .modal-body { padding: 1.8rem; }

  .modal-id-badge {
    display: inline-block;
    background: var(--emerald);
    color: #FFF8E1;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1.2rem;
  }

  .modal-rawy {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--parchment-deep);
    font-size: 0.95rem;
    color: var(--ink-light);
    font-weight: bold;
    text-align: right;
  }

  .modal-hint-box {
    background: var(--gold-pale);
    border: 1px dashed var(--gold);
    border-radius: 10px;
    padding: 0.8rem 1.1rem;
    margin-top: 1.2rem;
    font-size: 0.98rem;
    color: var(--ink-light);
    line-height: 1.8;
  }

  .modal-hint-label {
    font-weight: 700;
    color: var(--gold);
    display: block;
    margin-bottom: 0.2rem;
  }

  /* ── شاشة الاختبار ومقارنة الكلمات ── */
  .diff-added {
    color: #6f2da8;
    text-decoration: line-through;
    opacity: 0.85;
    background: rgba(111, 45, 168, 0.08);
    padding: 0 4px;
    border-radius: 3px;
  }

  .diff-removed {
    cursor: pointer;
    color: #e53e3e;
    font-size: 1.1em;
    margin: 0 0.15rem;
    display: inline-block;
  }

  .diff-removed-text {
    display: none;
    font-size: 0.9em;
    background: #fff0f0;
    border: 1px dashed #e53e3e;
    border-radius: 4px;
    padding: 0.1rem 0.5rem;
    margin: 0 0.2rem;
  }

  .diff-removed.expanded .diff-removed-text { display: inline; }
  .diff-removed.expanded .diff-removed-icon { display: none; }

  .test-writing-area {
    width: 100%;
    min-height: 140px;
    margin-top: 1.5rem;
    padding: 1.2rem;
    font-family: 'Amiri', 'Traditional Arabic', serif;
    font-size: 1.35rem;
    line-height: 2;
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    resize: vertical;
    direction: rtl;
    color: var(--ink);
  }

  .test-writing-area:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.25);
  }

  .correction-result {
    margin-top: 1.5rem;
    padding: 1.5rem;
    background: #FFFDF7;
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    font-size: 1.35rem;
    line-height: 2.2;
    color: var(--ink);
    text-align: justify;
  }

  .test-btn {
    background: var(--gold);
    color: var(--ink);
    font-size: 1.15rem;
    padding: 0.75rem 2.2rem;

<!-- نافذة إعدادات الاختبار -->
<div class="modal-overlay" id="test-modal" onclick="closeTestModalOnOverlay(event)">

<!-- نافذة عرض الحديث كاملاً مع التلوين المعتمد -->
<div class="modal-overlay" id="modal" onclick="closeModalOnOverlay(event)">
  <div class="modal-box">

        <span id="modal-hint"></span>

<script>
let HADITH_DATA = [];
let KITABS_ARRAY = [];
let currentKitabIndex = 0;
let currentBabIndex = 0;

/* تحميل البيانات من الملف المرفق */
async function loadHadithData() {
  try {
    const res = await fetch('./hadith.json');
    if (!res.ok) throw new Error('فشل جلب hadith.json: ' + res.statusText);
    HADITH_DATA = await res.json();
    processData();
    renderKitabs();
  } catch (error) {
    console.error("خطأ في قراءة البيانات:", error);
    const grid = document.getElementById('kitabs-grid');
    if (grid) {
      grid.innerHTML = `<div class="error-banner">تعذّر تحميل ملف البيانات <strong>hadith.json</strong>.<br>تأكد من وجود الملف بجانب الصفحة وتشغيلها عبر خادم محلي (Local Server).</div>`;
    }
  }
}

/* تجميع الأحاديث حسب الكتب ثم الأبواب مع الحفاظ على الترتيب الأصلي */
function processData() {
  const kitabMap = new Map();

  HADITH_DATA.forEach(h => {
    const kName = h.kitab_name || 'كِتَابٌ';
    const bName = h.bab_name || 'مُقَدِّمَةٌ';

    if (!kitabMap.has(kName)) {
      kitabMap.set(kName, {
        number: kitabMap.size + 1,
        name: kName,
        babsMap: new Map(),
        babs: [],
        totalHadiths: 0
      });
    }

    const kitab = kitabMap.get(kName);
    if (!kitab.babsMap.has(bName)) {
      const babObj = {
        number: kitab.babs.length + 1,
        name: bName,
        hadiths: []
      };
      kitab.babsMap.set(bName, babObj);
      kitab.babs.push(babObj);
    }

    kitab.babsMap.get(bName).hadiths.push(h);
    kitab.totalHadiths++;
  });

  KITABS_ARRAY = Array.from(kitabMap.values());
}

/* صيغ الأعداد العربية المناسبة للكتب والأبواب والأحاديث */
function formatCount(count, singular, dual, plural, accusativeSingular) {
  const ar = toArabicNum(count);
  if (count === 1) return `${singular} واحد`;
  if (count === 2) return dual;
  if (count >= 3 && count <= 10) return `${ar} ${plural}`;
  return `${ar} ${accusativeSingular}`;
}

/* ── دالة التلوين المتقدمة للنصوص النبوية ── */
function renderHadithHtml(content) {
  if (!content) return '';

  const hasHtmlTags = /<[a-z][\s\S]*>/i.test(content);
  let html = content;

  if (!hasHtmlTags) {
    // 1. تلوين الآيات القرآنية بين ﴿...﴾ بالكحلي الغامق
    html = html.replace(/﴿([^﴾]+)﴾/g, '<span class="quran-ayah">﴿$1﴾</span>');

    // 2. تلوين السند في مستهل الحديث بالكحلي العريض
    html = html.replace(
      /^([^\n«»]+?رَضِيَ الل(?:َّ)?هُ عَنْ(?:هُمَا|هُمْ|هُم|هَا|هُ)(?:\s*-\s*[^\-«»]+\s*-)?(?:\s*(?:قَالَ|قَالَتْ|أَنَّهُ قَالَ|أَنَّهَا قَالَتْ))?\s*[:،]?)/m,
      '<span class="auto-sanad">$1</span>'
    );

    // 3. تلوين عناوين الروايات الأخرى والزيادات بالأحمر
    html = html.replace(
      /((?:وَفِي\s+(?:رِوَايَةٍ|لَفْظٍ|حَدِيثِ)(?:\s+لِمُسْلِمٍ|\s+لِلْبُخَارِيِّ|\s+[^:«»]+)?|وَلِمُسْلِمٍ(?:\s+وَحْدَهُ)?(?:\s+عَنْ\s+[^:«»]+)?|وَلِلْبُخَارِيِّ|وَلَهُ(?:\s+فِي\s+حَدِيثِ\s+[^:«»]+|\s+عَنْ\s+[^:«»]+)?|زَادَ\s+مُسْلِمٌ|وَأَخْرَجَهُ\s+أَبُو\s+دَاوُدَ\s+وَقَالَ)\s*:)/g,
      '<span class="text-red">$1</span>'
    );

    // 4. تلوين التعليقات والتنبيهات المسبوقة بنجمة أو نقطة إن وجدت
    html = html.replace(/(?:^|\n)([\*•]\s*\([^\)]+\))/g, '\n<span class="text-red">$1</span>');

    // تحويل نهايات الأسطر إلى فواصل <br>
    html = html.replace(/\n/g, '<br>');
  } else {
    html = html.replace(/([^>])\n/g, '$1<br>');
  }

  return html;
}

/* تجريد النص لمقارنة التسميع */
function stripHtml(html) {
  if (!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

/* التنقل بين الشاشات الرئيسية */
function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(screenId);
  if (target) {
    target.classList.add('active');
  }
  window.scrollTo(0, 0);
}

/* عرض شبكة الكتب في الصفحة الرئيسية */
function renderKitabs() {
  const grid = document.getElementById('kitabs-grid');
  grid.innerHTML = '';

  const kitabSelect = document.getElementById('test-start-kitab');
  if (kitabSelect) {
    kitabSelect.innerHTML = '<option value="all">جميع الكتب (الكتاب كاملاً)</option>';
  }

  KITABS_ARRAY.forEach((kitab, index) => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';

    const hadithLabel = formatCount(kitab.totalHadiths, 'حديث', 'حديثان', 'أحاديث', 'حديثاً');
    const descText = kitab.babs.length > 1
      ? `${formatCount(kitab.babs.length, 'باب', 'بابان', 'أبواب', 'باباً')} • ${hadithLabel}`
      : hadithLabel;

    btn.innerHTML = `
      <div class="card-btn-subtitle">الكتاب ${toArabicNum(kitab.number)}</div>
      <div class="card-btn-title">${kitab.name}</div>
      <div class="card-btn-desc">${descText}</div>
    `;
    btn.onclick = () => openKitab(index);
    grid.appendChild(btn);

    if (kitabSelect) {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${kitab.name} (${toArabicNum(kitab.totalHadiths)})`;
      kitabSelect.appendChild(opt);
    }
  });

  updateTestBabOptions();
}

/* فتح الكتاب: إذا كان له باب واحد فقط ننتقل للأحاديث مباشرة، وإلا نعرض صفحة الأبواب */
function openKitab(kitabIndex) {
  const kitab = KITABS_ARRAY[kitabIndex];
  if (!kitab) return;

  currentKitabIndex = kitabIndex;
  if (kitab.babs.length === 1) {
    showBab(kitabIndex, 0);
  } else {
    showKitabBabs(kitabIndex);
  }
}

/* عرض قائمة الأبواب داخل الكتاب */
function showKitabBabs(kitabIndex) {
  currentKitabIndex = kitabIndex;
  const kitab = KITABS_ARRAY[kitabIndex];

  document.getElementById('kitab-view-num').textContent = 'الكتاب ' + toArabicNum(kitab.number);
  document.getElementById('kitab-view-name').textContent = kitab.name;

  document.getElementById('prev-kitab-btn').disabled = (kitabIndex === 0);
  document.getElementById('next-kitab-btn').disabled = (kitabIndex === KITABS_ARRAY.length - 1);

  const grid = document.getElementById('babs-grid');
  grid.innerHTML = '';

  kitab.babs.forEach((bab, bIndex) => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    const hadithLabel = formatCount(bab.hadiths.length, 'حديث', 'حديثان', 'أحاديث', 'حديثاً');
    btn.innerHTML = `
      <div class="card-btn-subtitle">الباب ${toArabicNum(bab.number)}</div>
      <div class="card-btn-title">${bab.name}</div>
      <div class="card-btn-desc">${hadithLabel}</div>
    `;
    btn.onclick = () => showBab(kitabIndex, bIndex);
    grid.appendChild(btn);
  });

  switchScreen('screen-babs');
}

function goPrevKitab() {
  if (currentKitabIndex > 0) {
    openKitab(currentKitabIndex - 1);
  }
}

function goNextKitab() {
  if (currentKitabIndex < KITABS_ARRAY.length - 1) {
    openKitab(currentKitabIndex + 1);
  }
}

function goBackToKitabs() {
  switchScreen('screen-kitabs');
}

/* عرض الأحاديث داخل الباب المحدد */
function showBab(kitabIndex, babIndex) {
  currentKitabIndex = kitabIndex;
  currentBabIndex = babIndex;

  const kitab = KITABS_ARRAY[kitabIndex];
  const bab = kitab.babs[babIndex];
  const isSingleBab = (kitab.babs.length === 1);

  if (isSingleBab) {
    document.getElementById('detail-bab-num').textContent = 'الكتاب ' + toArabicNum(kitab.number);
    document.getElementById('detail-bab-name').textContent =
      (bab.name && bab.name !== 'مُقَدِّمَةٌ') ? `${kitab.name} — ${bab.name}` : kitab.name;
  } else {
    document.getElementById('detail-bab-num').textContent = `${kitab.name} — الباب ${toArabicNum(bab.number)}`;
    document.getElementById('detail-bab-name').textContent = bab.name;
  }

  const prevBtn = document.getElementById('prev-bab-btn');
  const nextBtn = document.getElementById('next-bab-btn');
  const backBtn = document.getElementById('hadith-back-btn');
  const homeBtn = document.getElementById('hadith-home-btn');

  if (isSingleBab) {
    prevBtn.innerHTML = '&#x2192; الكتاب السابق';
    prevBtn.onclick = goPrevKitab;
    prevBtn.disabled = (kitabIndex === 0);

    nextBtn.innerHTML = 'الكتاب التالي &#x2190;';
    nextBtn.onclick = goNextKitab;
    nextBtn.disabled = (kitabIndex === KITABS_ARRAY.length - 1);

    backBtn.textContent = 'العودة إلى الكتب';
    homeBtn.style.display = 'none';
  } else {
    prevBtn.innerHTML = '&#x2192; الباب السابق';
    prevBtn.onclick = goPrevBab;
    prevBtn.disabled = (babIndex === 0);

    nextBtn.innerHTML = 'الباب التالي &#x2190;';
    nextBtn.onclick = goNextBab;
    nextBtn.disabled = (babIndex === kitab.babs.length - 1);

    backBtn.textContent = 'العودة إلى الأبواب';
    homeBtn.style.display = 'inline-flex';
  }

  const grid = document.getElementById('hadith-grid');
  grid.innerHTML = '';

  bab.hadiths.forEach(h => {
    const card = document.createElement('div');
    card.className = 'hadith-card';

    card.innerHTML = `
      <div>
        <div class="hadith-id-badge">حديث ${toArabicNum(h.id)}</div>
        <div class="hadith-card-sahabi">
          <span class="sahabi-prefix">عن</span>
          ${h.rawi || ''}
        </div>
        <div class="divider"></div>
        <div class="hint-section">
          <button class="hint-btn" id="hint-btn-${h.id}" onclick="toggleHint(event,'${h.id}')">✦ التلميح</button>
          <button class="test-inline-btn" onclick="startSingleTest(event, '${h.id}')">اختبار</button>
          <button class="mask-inline-btn" onclick="startMaskScreen(event, '${h.id}')">حجب</button>
          <div class="hint-text-display" id="hint-text-${h.id}">${h.hint || ''}</div>
        </div>
      </div>
      <div class="tap-hint">اضغط على البطاقة لعرض الحديث كاملاً</div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.hint-btn') || e.target.closest('.test-inline-btn') || e.target.closest('.mask-inline-btn')) return;
      openModal(h);
    });

    grid.appendChild(card);
  });

  switchScreen('screen-hadith');
}

function goPrevBab() {
  if (currentBabIndex > 0) {
    showBab(currentKitabIndex, currentBabIndex - 1);
  }
}

function goNextBab() {
  const kitab = KITABS_ARRAY[currentKitabIndex];
  if (kitab && currentBabIndex < kitab.babs.length - 1) {
    showBab(currentKitabIndex, currentBabIndex + 1);
  }
}

function goBackFromHadith() {
  const kitab = KITABS_ARRAY[currentKitabIndex];
  if (kitab && kitab.babs.length === 1) {
    switchScreen('screen-kitabs');
  } else {
    showKitabBabs(currentKitabIndex);
  }
}

function toggleHint(event, id) {
  event.stopPropagation();
  const txt = document.getElementById('hint-text-' + id);
  if (txt) {
    txt.classList.toggle('shown');
  }
}

/* ── النافذة المنبثقة للحديث ── */
function openModal(h) {
  document.getElementById('modal-sahabi').textContent = h.rawi || '';
  document.getElementById('modal-id').textContent = 'حديث ' + toArabicNum(h.id);

  const contentEl = document.getElementById('modal-content');
  contentEl.innerHTML = renderHadithHtml(h.content);

  document.getElementById('modal-rawy').textContent = `${h.kitab_name || ''} — ${h.bab_name || ''}`;

  if (h.hint) {
    document.getElementById('modal-hint-container').style.display = 'block';
    document.getElementById('modal-hint').textContent = h.hint;
  } else {
    document.getElementById('modal-hint-container').style.display = 'none';
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeTestModal();
    if (document.getElementById('screen-mask').classList.contains('active')) {
      exitMaskScreen();
    }
  }
});

/* ── منطق الاختبار والتسميع ── */
let testMode = 'sequential';
let testAnswerMethod = 'without_writing';
let testFrontMode = 'show';
let currentTestHadiths = [];
let currentTestHadithIndex = 0;
let isAnswerRevealed = false;
let previousScreenBeforeTest = 'screen-kitabs';

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function updateTestBabOptions() {
  const kitabVal = document.getElementById('test-start-kitab').value;
  const babGroup = document.getElementById('test-bab-group');
  const babSelect = document.getElementById('test-start-bab');

  if (kitabVal === 'all') {
    babGroup.style.display = 'none';
    babSelect.innerHTML = '<option value="all">جميع الأبواب</option>';
    return;
  }

  const kitab = KITABS_ARRAY[parseInt(kitabVal, 10)];
  if (!kitab || kitab.babs.length <= 1) {
    babGroup.style.display = 'none';
    babSelect.innerHTML = '<option value="all">جميع الأبواب</option>';
    return;
  }

  babSelect.innerHTML = '<option value="all">جميع أبواب الكتاب</option>';
  kitab.babs.forEach((bab, bIdx) => {
    const opt = document.createElement('option');
    opt.value = bIdx;
    opt.textContent = `الباب ${toArabicNum(bab.number)}: ${bab.name} (${toArabicNum(bab.hadiths.length)})`;
    babSelect.appendChild(opt);
  });
  babGroup.style.display = 'block';
}

function openTestModal() {
  document.getElementById('test-modal').classList.add('open');
}

function closeTestModal() {
  document.getElementById('test-modal').classList.remove('open');
}

function closeTestModalOnOverlay(e) {
  if (e.target === document.getElementById('test-modal')) closeTestModal();
}

function exitTest() {
  switchScreen(previousScreenBeforeTest);
}

function startTest() {
  previousScreenBeforeTest = 'screen-kitabs';
  testMode = document.getElementById('test-mode').value;
  testAnswerMethod = document.getElementById('test-answer-method').value;
  testFrontMode = document.getElementById('test-front-type').value;

  const kitabVal = document.getElementById('test-start-kitab').value;
  const babVal = document.getElementById('test-start-bab').value;

  if (kitabVal === 'all') {
    currentTestHadiths = [...HADITH_DATA];
  } else {
    const kitab = KITABS_ARRAY[parseInt(kitabVal, 10)];
    if (kitab.babs.length === 1 || babVal === 'all') {
      currentTestHadiths = kitab.babs.flatMap(b => b.hadiths);
    } else {
      const bIdx = parseInt(babVal, 10);
      currentTestHadiths = [...kitab.babs[bIdx].hadiths];
    }
  }

  if (testMode === 'random') {
    shuffleArray(currentTestHadiths);
  }

  currentTestHadithIndex = 0;
  closeTestModal();
  switchScreen('screen-test');
  renderTestCard();
}

function startSingleTest(event, id) {
  event.stopPropagation();
  const h = HADITH_DATA.find(hadith => String(hadith.id) === String(id));
  if (!h) return;

  previousScreenBeforeTest = 'screen-hadith';
  testMode = 'sequential';
  testAnswerMethod = 'with_writing';
  testFrontMode = 'show';

  currentTestHadiths = [h];
  currentTestHadithIndex = 0;

  switchScreen('screen-test');
  renderTestCard();
}

function renderTestCard() {
  const h = currentTestHadiths[currentTestHadithIndex];
  isAnswerRevealed = false;

  document.getElementById('test-bab-title').textContent = `${h.kitab_name || ''} — ${h.bab_name || ''}`;
  document.getElementById('test-progress').textContent =
    'الحديث ' + toArabicNum(currentTestHadithIndex + 1) + ' من ' + toArabicNum(currentTestHadiths.length);

  let frontHtml = '';
  if (testFrontMode === 'show') {
    frontHtml = `
      <div class="hadith-card-sahabi" style="padding:0; margin-bottom:1rem; text-align:center;">
        <span class="sahabi-prefix">عن</span> ${h.rawi || ''}
      </div>
      <div class="divider" style="margin: 1.2rem auto; width: 80px;"></div>
      <button class="hint-btn" onclick="event.stopPropagation(); const hEl=document.getElementById('test-card-hint'); hEl.style.display = (hEl.style.display==='block'?'none':'block');">✦ التلميح</button>
      <div id="test-card-hint" class="hint-text-display" style="display:none; margin: 1.5rem auto 0; text-align: center; max-width: 600px;">${h.hint || ''}</div>
    `;
  } else {
    frontHtml = `<div class="hint-text-display" style="display:block; font-size: 1.25rem; background:transparent; border:none; text-align:center; line-height:2;">${h.hint || ''}</div>`;
  }
  document.getElementById('test-card-front').innerHTML = frontHtml;

  document.getElementById('test-card-back').innerHTML = `
    <div style="font-size: 1.25rem; color: var(--emerald); font-weight: bold; margin-bottom: 0.3rem;">عن ${h.rawi || ''}</div>
    <div style="font-size: 0.9rem; color: var(--gold); margin-bottom: 1.2rem;">حديث ${toArabicNum(h.id)} — ${h.kitab_name || ''} (${h.bab_name || ''})</div>
    <div class="hadith-text-rendered">${renderHadithHtml(h.content)}</div>
  `;

  document.getElementById('test-card-front').style.display = 'block';
  document.getElementById('test-card-back').style.display = 'none';
  document.getElementById('test-actions').style.display = 'none';

  if (testAnswerMethod === 'with_writing') {
    document.getElementById('test-writing-section').style.display = 'block';
    document.getElementById('test-writing-input').value = '';
    document.getElementById('test-correction-result').style.display = 'none';
    document.getElementById('test-tap-hint').style.display = 'none';
    document.getElementById('test-card-container').style.cursor = 'default';
  } else {
    document.getElementById('test-writing-section').style.display = 'none';
    document.getElementById('test-correction-result').style.display = 'none';
    document.getElementById('test-tap-hint').style.display = 'block';
    document.getElementById('test-tap-hint').textContent = 'انقر لإظهار الإجابة';
    document.getElementById('test-card-container').style.cursor = 'pointer';
  }
}

function revealTestAnswerCheck(e) {
  if (testAnswerMethod === 'with_writing') return;
  revealTestAnswer();
}

function evaluateWriting() {
  if (isAnswerRevealed) return;
  const h = currentTestHadiths[currentTestHadithIndex];
  const submitted = document.getElementById('test-writing-input').value;

  const rawOriginal = stripHtml(h.content);
  const diff = getWordDiff(rawOriginal, submitted);
  const diffHtml = renderDiffHTML(diff);

  document.getElementById('test-correction-result').innerHTML = `
    <div style="font-size:1.05rem; color:var(--emerald); font-weight:bold; margin-bottom:0.8rem;">إجابتك بعد المقارنة:</div>
    <div style="line-height:2.2;">${diffHtml}</div>
  `;
  document.getElementById('test-correction-result').style.display = 'block';
  document.getElementById('test-writing-section').style.display = 'none';

  revealTestAnswer();
}

function normalizeArabic(text) {
  if (!text) return '';
  let t = text.replace(/[\u0617-\u061A\u064B-\u0652\u0670]/g, '');
  t = t.replace(/[أإآٱ]/g, 'ا');
  t = t.replace(/ة/g, 'ه');
  t = t.replace(/[ىي]/g, 'ي');
  t = t.replace(/[\u0640]/g, '');
  t = t.replace(/[\u0600-\u0605\u0610-\u0615\u06D6-\u06ED]/g, '');
  return t.trim();
}

function cleanTokens(text) {
  return text.replace(/[،.؛:()«»"'؟!?\-–—﴿﴾\[\]*~•ﷺ❖]/g, ' ')
             .trim()
             .split(/\s+/)
             .filter(Boolean);
}

function getWordDiff(original, submitted) {
  const origWords = cleanTokens(original);
  const subWords = cleanTokens(submitted);

  const normOriginal = origWords.map(normalizeArabic);
  const normSubmitted = subWords.map(normalizeArabic);

  const dp = Array(normOriginal.length + 1).fill(null).map(() => Array(normSubmitted.length + 1).fill(0));

  for (let i = 1; i <= normOriginal.length; i++) {
    for (let j = 1; j <= normSubmitted.length; j++) {
      if (normOriginal[i - 1] === normSubmitted[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }

  let i = normOriginal.length;
  let j = normSubmitted.length;
  const result = [];

  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && normOriginal[i - 1] === normSubmitted[j - 1]) {
      result.unshift({ type: 'equal', value: subWords[j - 1] });
      i--;
      j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      result.unshift({ type: 'added', value: subWords[j - 1] });
      j--;
    } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
      result.unshift({ type: 'removed', value: origWords[i - 1] });
      i--;
    }
  }

  return result;
}

function renderDiffHTML(diff) {
  let html = '';
  let removedBuffer = [];

  const flushRemoved = () => {
    if (removedBuffer.length > 0) {
      const tooltip = removedBuffer.join(' ');
      html += ` <span class="diff-removed" onclick="this.classList.toggle('expanded')" title="اضغط لإظهار ما نقص"><span class="diff-removed-icon">❌</span><span class="diff-removed-text">${tooltip}</span></span> `;
      removedBuffer = [];
    }
  };

  diff.forEach(item => {
    if (item.type === 'removed') {
      removedBuffer.push(item.value);
    } else {
      flushRemoved();
      if (item.type === 'added') {
        html += ` <span class="diff-added">${item.value}</span> `;
      } else {
        html += ` ${item.value} `;
      }
    }
  });
  flushRemoved();
  return html.trim();
}

function revealTestAnswer() {
  if (isAnswerRevealed) return;
  isAnswerRevealed = true;
  document.getElementById('test-card-front').style.display = 'none';
  document.getElementById('test-card-back').style.display = 'block';
  document.getElementById('test-tap-hint').style.display = 'none';
  document.getElementById('test-actions').style.display = 'flex';

  const isLast = (currentTestHadithIndex === currentTestHadiths.length - 1);
  const nextBtn = document.getElementById('test-next-btn');
  if (isLast) {
    nextBtn.textContent = 'إنهاء الاختبار';
    nextBtn.onclick = exitTest;
  } else {
    nextBtn.textContent = 'الحديث التالي \u2190';
    nextBtn.onclick = nextTestHadith;
  }
}

function nextTestHadith() {
  currentTestHadithIndex++;
  renderTestCard();
}

function retryTestHadith() {
  renderTestCard();
}

function toggleFrontView() {
  const val = document.getElementById('front-toggle').value;
  if (val === 'hide') {
    document.body.classList.add('hide-rawy');
  } else {
    document.body.classList.remove('hide-rawy');
  }
}

function toArabicNum(str) {
  return String(str).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

/* ═════════════════════════════════════════════════════════════
   منطق شاشة حجب الحديث والتسميع التدريجي
   ═════════════════════════════════════════════════════════════ */
let totalMaskedWords = 0;
let revealedWordCount = 0;

function startMaskScreen(event, id) {
  if (event) event.stopPropagation();
  const h = HADITH_DATA.find(hadith => String(hadith.id) === String(id));
  if (!h) return;

  document.getElementById('mask-bab-num').textContent = h.kitab_name || '';
  document.getElementById('mask-bab-name').textContent = h.bab_name || '';
  document.getElementById('mask-sahabi').textContent = 'عن ' + (h.rawi || '');
  document.getElementById('mask-id-badge').textContent = 'حديث ' + toArabicNum(h.id);
  document.getElementById('mask-rawy').textContent = `${h.kitab_name || ''} — ${h.bab_name || ''}`;

  const renderedFormatted = renderHadithHtml(h.content);
  const container = document.getElementById('mask-hadith-content');

  prepareMaskedWords(container, renderedFormatted);

  revealedWordCount = 0;
  updateMaskedDisplay();
  switchScreen('screen-mask');
}

function exitMaskScreen() {
  switchScreen('screen-hadith');
}

function prepareMaskedWords(container, html) {
  container.innerHTML = html;
  totalMaskedWords = 0;

  function traverse(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.nodeValue;
      if (!text || !text.trim()) return;

      const tokens = text.split(/(\s+)/);
      const frag = document.createDocumentFragment();

      tokens.forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) {
          frag.appendChild(document.createTextNode(tok));
        } else {
          const span = document.createElement('span');
          span.className = 'masked-word is-masked';
          span.dataset.index = totalMaskedWords++;
          span.textContent = tok;
          frag.appendChild(span);
        }
      });

      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      Array.from(node.childNodes).forEach(child => traverse(child));
    }
  }

  traverse(container);
}

document.getElementById('mask-hadith-content').addEventListener('click', (e) => {
  const target = e.target.closest('.masked-word');
  if (!target) return;
  const idx = parseInt(target.dataset.index, 10);
  if (!isNaN(idx)) {
    revealedWordCount = Math.max(revealedWordCount, idx + 1);
    updateMaskedDisplay();
  }
});

function maskRevealWord(count = 1) {
  revealedWordCount = Math.min(totalMaskedWords, revealedWordCount + count);
  updateMaskedDisplay();
  scrollRevealedWordIntoView(revealedWordCount - 1);
}

function maskRevealAll() {
  revealedWordCount = totalMaskedWords;
  updateMaskedDisplay();
}

function maskReset() {
  revealedWordCount = 0;
  updateMaskedDisplay();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateMaskedDisplay() {
  const words = document.querySelectorAll('#mask-hadith-content .masked-word');
  words.forEach(w => {
    const idx = parseInt(w.dataset.index, 10);
    if (idx < revealedWordCount) {
      w.classList.remove('is-masked');
    } else {
      w.classList.add('is-masked');
    }
  });
}

function scrollRevealedWordIntoView(idx) {
  if (idx < 0) return;
  const wordEl = document.querySelector(`#mask-hadith-content .masked-word[data-index="${idx}"]`);
  if (wordEl) {
    const rect = wordEl.getBoundingClientRect();
    const bottomOffset = 110;
    if (rect.bottom > window.innerHeight - bottomOffset || rect.top < 60) {
      wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}
